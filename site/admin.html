<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Card 管理</title>
    <link rel="icon" type="image/svg+xml" href="/legend-card-icon.svg">
    <link rel="stylesheet" href="/admin.css">
</head>
<body>
    <main class="admin-shell">
        <header class="admin-header">
            <div>
                <p class="admin-kicker">HYB CARD DASHBOARD</p>
                <h1>站点管理</h1>
            </div>
            <a class="admin-back-link" href="/">返回首页</a>
        </header>

        <section class="admin-panel" id="adminLoginPanel" aria-labelledby="adminLoginTitle">
            <div class="admin-panel-heading">
                <div>
                    <p class="admin-eyebrow">ADMIN ACCESS</p>
                    <h2 id="adminLoginTitle">管理员登录</h2>
                </div>
                <span class="admin-status-dot" aria-hidden="true"></span>
            </div>
            <form id="adminLoginForm" class="admin-form">
                <label class="admin-field" for="adminPassword">
                    <span>管理员密码</span>
                    <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>
                </label>
                <button class="admin-button admin-button-primary" id="adminLoginButton" type="submit">登录</button>
                <p class="admin-message" id="adminLoginMessage" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="admin-panel" id="adminConfigPanel" hidden aria-labelledby="adminConfigTitle">
            <div class="admin-panel-heading">
                <div>
                    <p class="admin-eyebrow">RUNTIME CONTROL</p>
                    <h2 id="adminConfigTitle">运行时开关</h2>
                </div>
                <button class="admin-button admin-button-quiet" id="adminLogoutButton" type="button">退出登录</button>
            </div>
            <p class="admin-description">关闭抓取或上传只影响新的同步请求，已有榜单数据仍可查看。</p>
            <form id="adminConfigForm" class="admin-form">
                <label class="admin-switch-row" for="adminSiteEnabled">
                    <span>
                        <strong>站点可用</strong>
                        <small>关闭后仅保留已有数据展示</small>
                    </span>
                    <input id="adminSiteEnabled" type="checkbox">
                    <span class="admin-switch" aria-hidden="true"></span>
                </label>
                <label class="admin-switch-row" for="adminRankingCaptureEnabled">
                    <span>
                        <strong>允许榜单抓取</strong>
                        <small>允许用户脚本访问 CDK 榜单</small>
                    </span>
                    <input id="adminRankingCaptureEnabled" type="checkbox">
                    <span class="admin-switch" aria-hidden="true"></span>
                </label>
                <label class="admin-switch-row" for="adminCloudUploadEnabled">
                    <span>
                        <strong>允许云端上传</strong>
                        <small>允许把本地快照写入 D1</small>
                    </span>
                    <input id="adminCloudUploadEnabled" type="checkbox">
                    <span class="admin-switch" aria-hidden="true"></span>
                </label>
                <label class="admin-field" for="adminMaintenanceMessage">
                    <span>停用提示</span>
                    <input id="adminMaintenanceMessage" type="text" maxlength="240" placeholder="例如：榜单同步暂时维护中">
                </label>
                <div class="admin-form-actions">
                    <button class="admin-button admin-button-primary" id="adminSaveButton" type="submit">保存配置</button>
                    <span class="admin-message" id="adminConfigMessage" role="status" aria-live="polite"></span>
                </div>
            </form>
        </section>
    </main>
    <script src="/admin.js" defer></script>
</body>
</html>
